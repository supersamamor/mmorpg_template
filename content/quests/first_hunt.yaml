# yaml-language-server: $schema=../../schemas/quest.schema.json
id: quest.first_hunt
name: First Hunt
description: Thin out the gel slimes in the meadow, then report back to Odalys.
giver_npc_id: npc.guide
repeatable: false
prerequisites:
  min_base_level: 1
steps:
  # One step: the kills and the globs count in the field, and talking to Odalys with both done is the turn-in. The globs are taken then, in the same
  # transaction that pays the rewards (T-602).
  - description: Defeat 5 Gel Slimes, gather 3 Gel Globs and bring them to Odalys.
    objectives:
      - { type: kill, monster_id: monster.gel_slime, count: 5 }
      - { type: collect, item_id: item.gel_glob, count: 3, consume: true }
      - { type: talk, npc_id: npc.guide }
rewards:
  - { type: exp, base: 40, job: 25 }
  - { type: item, item_id: item.healing_draught, count: 5 }
  - { type: currency, amount: 150 }
  # The two placeholder outfits (T-708), so that every new character has something in its wardrobe early. They change nothing but looks.
  - { type: outfit, outfit_id: outfit.harvest_garland }
  - { type: outfit, outfit_id: outfit.rain_cloak }
