    radius: 2
    friendly: true
    effects:
      - type: restore_sp
        amount: 10 + level * 5
animation_id: cast
icon_asset_key: icon.skill.mana_font
vfx_asset_key: vfx.skill.mana_font
sfx_asset_key: sfx.skill.buff
