# yaml-language-server: $schema=../schemas/balance.schema.json
# Tuning numbers that are not per-entity stats (ARCHITECTURE §6.5). Chances are 0-1 probabilities,
# the same scale the hit_chance / crit_chance formulas in formulas.yaml return.
name: Lumen Vale balance
# What the single currency (engine id "currency") is called on screen.
currency_name: crowns
progression:
  # EXP curve for base levels. Its length sets the max base level (99 entries + 1 = level 99).
  base_exp_table_id: exp.base
  # Stat points gained on reaching base level L: 3 early, then 1 more per 10 levels. About 740 points over levels 2-99.
  stat_points_per_base_level: floor(base_level / 10) + 3
  # Skill points gained on reaching job level L: one per level, so a 50-level job grants 49 points.
  skill_points_per_job_level: "1"
  # A new character starts with a small pool so the first choices are visible right away.
  starting_stat_points: 10
  # Every primary stat starts at 1 (before job and equipment bonuses).
  starting_stat_value: 1
  # Primary stats cap at 99 from points alone; gear and buffs may exceed it.
  max_stat_value: 99
  # Cost to raise a stat from its current value by one: 2 points up to 10, rising by 1 every 10 points (2..11).
  stat_point_cost: floor((stat_value - 1) / 10) + 2
  # Resetting stats or skills with an item (T-503). There is no currency yet, so a reset costs the item itself.
  reset:
    # Below base level 10 a reset is free: the item does its work and is kept, so a new player can try builds while learning the game.
    free_below_base_level: 10
    # No reset within the out-of-combat delay (regen.out_of_combat_delay_ms) of the last damage dealt or taken: no mid-fight respec.
    refuse_in_combat: true
    # A dead character cannot reset.
    refuse_when_dead: true
combat:
  # A hit that lands always deals at least 1 damage, so heavy armor never makes a target immune.
  min_damage: 1
  # Single-hit ceiling that keeps numbers inside display and integer limits.
  max_damage: 999999
  # Even a huge level gap leaves a 5% chance to hit.
  min_hit_chance: 0.05
  # No attack is guaranteed: at least a 5% chance to miss.
  max_hit_chance: 0.95
  # Critical hits can be fully suppressed.
  min_crit_chance: 0
  # Crits cap at 50% so they stay a bonus rather than the baseline.
  max_crit_chance: 0.5
  # A critical hit deals 50% more damage. A formula, so it can scale later (e.g. with luk).
  crit_multiplier: "1.5"
  # Unarmed players hit what stands next to them (diagonals included). Weapons bring their own range later.
  player_attack_range: 1
  # A player walking into range of a moving target re-plans its path at most twice a second, like a chasing monster.
  player_repath_interval_ms: 500
movement:
  # Longest route, in cells, a path search may return (about the width of a screen of play). Longer routes are refused as "no path".
  max_path_length: 64
  # Nodes a single A* search may expand. Above the cell count of the largest sample map (48x32 = 1536), so no sample search is cut off.
  max_nodes_expanded: 2048
aoi:
  # Side of one area-of-interest bucket, in cells. A landscape phone with the fixed 3/4 camera shows, as measured in T-206, about 22 cells
  # wide at the top edge and about 11 deep at the default zoom, split 7 ahead of the player and 4 behind. Small buckets keep the seen area
  # close to the screen; 6 cells puts the sample maps at 8 x 6 (starter_meadow) and 4 x 3 (thistle_hollow) buckets.
  bucket_size: 6
  # Buckets seen around the observer's own. An observer sees at least view_radius * bucket_size = 12 cells in every direction
  # (just past the 11-cell screen edge) and at most 17, so entities appear a little before they walk on screen.
  view_radius: 2
  # Most entities one observer is sent, itself included. ARCHITECTURE §9 budgets 10 KB/s per client at 50 visible, and the T-214 load test
  # agrees: 200 bots in one view cost at most 9.95 KB/s for any client at 50, but 11.3 KB/s at 60 and 13.4 KB/s at 80.
  max_visible: 50
  # A new entity enters at rank max_visible - cap_hysteresis or better; one already shown stays until it ranks past max_visible. A tenth of
  # the cap: wide enough that entities milling about at the edge do not flicker, and a full view still holds 45 to 50.
  cap_hysteresis: 5
  # Slots of max_visible kept for the nearest monsters; a slot a kind does not use goes back to the others, nearest first. The start map
  # holds 26 monsters on 48 x 32 cells, and we estimate a view covers about half of that (not measured), so 15 should show a normal field in full. The three
  # shares add up to half the cap, so a crowd of players still gets at least the other half.
  cap_reserved_monsters: 15
  # Slots kept for the nearest NPCs. A town has a few within reach (the start map's guide and trainer stand together), so a quest NPC stays on screen.
  cap_reserved_npcs: 4
  # Slots kept for the nearest ground items, estimated at about the drops of the last two kills (not measured). Items this observer may pick up rank first.
  cap_reserved_items: 6
  # Ranks an entity already shown may slip past its reservation, or past cap_pinned_chasers, and keep its slot. About a tenth of the largest
  # share, the same proportion as cap_hysteresis has to the cap.
  cap_reserved_margin: 2
  # Monsters chasing the observer that are always visible before their first hit, nearest first: the 8 cells around it and two more on
  # the way. With the margin that is at most 12 of the cap, however long the train. The rest rank like any monster until they hit.
  cap_pinned_chasers: 10
new_character:
  # A new character appears in the starter meadow's safe zone, a few steps south of the guide and the trainer, facing them.
  start_map_id: map.starter_meadow
  start_x: 12
  start_y: 12
  start_facing: n
  # Everyone starts as a Wanderer and picks a job later (the job is also what other players see them as until gear exists).
  start_job_id: job.wanderer
  # The Bone Dirk's description promises every wanderer one; it is worn from the start. Three draughts get a new player through the first fights.
  # One reset of each kind (T-503), so the first respec never needs a shop: below level 10 a reset is free and keeps the item, after that it is used up.
  start_items:
    - { item_id: item.bone_dirk, equipped: true }
    - { item_id: item.healing_draught, quantity: 3 }
    - { item_id: item.realign_tonic, quantity: 1 }
    - { item_id: item.blank_page, quantity: 1 }
ai:
  # An awake aggressive monster looks around for a player three times a second: quick enough that walking into its range feels
  # immediate, and a fraction of the per-tick work of scanning every tick.
  think_interval_ms: 300
  # Idle monsters pause 4 to 10 seconds between short strolls, so a field looks alive without everything moving at once.
  wander_pause_min_ms: 4000
  wander_pause_max_ms: 10000
  # A stroll ends at most 4 cells from the monster's home cell, so monsters stay in their spawn area.
  wander_radius: 4
  # A chasing monster re-plans its path at most twice a second; between searches it keeps walking the last path.
  repath_interval_ms: 500
  # A monster that gave up a chase walks home; if it is not home after 15 seconds (blocked, path too long), it is put back there.
  return_timeout_ms: 15000
  # A monster that gave up and walked home heals to full on arrival, so hit-and-run cannot wear it down. Set false to keep its wounds.
  heal_on_return: true
death:
  # A player who respawns comes back with half of their max HP, so the first fight after a death is not a free one.
  respawn_hp_percent: 50
  # Dying costs 1% of the EXP the current level needs: a small sting, and it never takes a level away.
  exp_penalty_percent: 1
  # A dead monster stays 2 seconds (Dead, not targetable) so clients can play the death animation, then it is removed. Its respawn timer counts from the death.
  corpse_ms: 2000
loot:
  # For 3 seconds after a drop only the player who dealt the most damage may pick it up; then anyone may.
  priority_ms: 3000
  # A ground item nobody picks up disappears after a minute.
  lifetime_ms: 60000
  # Drops scatter onto walkable cells up to 1 cell from where the monster died, so several drops stay tappable.
  spread_radius: 1
regen:
  # Natural regeneration (hp_regen / sp_regen from formulas.yaml) pauses for 5 seconds after an entity deals or takes damage,
  # so it helps between fights without making a fight itself easier.
  out_of_combat_delay_ms: 5000
inventory:
  # Most entries a character holds: a stack counts once, each piece of equipment once, worn ones included. A hundred is room for a day of loot.
  max_entries: 100
  # From half the weight limit natural HP and SP regeneration stops: carrying a full load has a cost before it stops a fight.
  burdened_percent: 50
  # From 90% the character can no longer attack, so a hauler has to drop or store something before the next fight. Pick-ups past 100% are refused.
  overweight_percent: 90
  # A ground item is picked up from the cell next to it (diagonals included), like a melee swing; the player walks there first.
  pickup_range: 1
  # An item a player drops stays two minutes for anyone to take: time to come back for something dropped by mistake.
  dropped_lifetime_ms: 120000
  # Held in both hands: a two-handed sword, a staff and a bow leave no hand for a shield (equipping one takes the other off).
  two_handed_weapon_types: [sword_2h, staff, bow]
dialogue:
  # A dialogue starts and lasts within 2 cells (diagonals included) of the NPC: close enough to read as a conversation, far enough that a tap on an NPC
  # does not have to walk onto it. A talk from farther walks the player in first; walking beyond this ends the dialogue and any service it opened.
  talk_range: 2
  # Refining needs a smith: the refine intent works only while an NPC's refine service is open (an open_service action) and the player is still in reach.
  refine_needs_service: true
shop:
  # One purchase may ask for at most 99 units: a full stack of a consumable (max_stack 99), so one tap-and-hold does not need a second purchase, and the largest total
  # (99 x the dearest price, 700) stays far from any number limit.
  max_buy_quantity: 99
quests:
  # How many quests a character may have going at once; one more start is refused (too_many_active) until one is completed or abandoned.
  max_active: 10
autopilot:
  # The quest autopilot (T-604): the server plays a player's ticked quests through the same orders and rules as the player. False refuses it.
  enabled: true
  # One run may be given as many quests as a character can have active (quests.max_active).
  max_quests: 10
  # Room for the largest skill bar the client can be configured to (hotbar_slots, at most 12); extra slots cost nothing.
  max_skills: 12
  # No daily limit. A fork that wants one sets minutes per 24 hours, counted from the first run of the day; pauses do not count.
  daily_limit_minutes: 0
  # Two minutes without a counter, a kill or getting nearer: longer than any respawn (20 s) or walk across the sample maps, short enough not to look stuck.
  no_progress_ms: 120000
  # Three decisions a second, like a monster's: a kill is followed up at once anyway (events wake a run early).
  decide_interval_ms: 300
  # Path searches all the runs of one map may share per tick. One search is capped by movement.max_nodes_expanded, so this caps what a crowd of runs costs;
  # a hundred hunting runs still get forty a second, more than they ask for.
  searches_per_tick: 4
  # A journey is walked 24 cells at a time: well inside movement.max_path_length (64), so a winding way still fits one search.
  leg_cells: 24
  # What every player is sure to see around the character (aoi.view_radius x aoi.bucket_size): wanted drops are fetched from there before the next fight.
  gather_range: 12
  # Healing shortcut skills are cast below 60% HP (and SP skills below 60% SP), about one hard hit before it gets dangerous.
  support_below_percent: 60
  # At the hunting ground, whatever hit the character in the last 3 seconds is fought first. On the way somewhere it walks on.
  retaliate_ms: 3000
  # A monster that could not be reached (or an item that could not be taken) is left alone for 10 seconds.
  avoid_ms: 10000
auto_battle:
  # Auto-battle (T-811): the autopilot's second mode fights the monsters around where it was started. Thinking, searches, skills, retaliation and the daily limit are autopilot's above.
  enabled: true
  # Six cells around the anchor: half of what every player is sure to see (12), so the whole area is in view from anywhere in it, and about one spawn area of the sample meadow.
  radius_cells: 6
  # Whatever hit the character is fought up to three cells beyond that, so a monster that strikes from just outside is answered, but nothing draws the character far away.
  retaliate_extra_cells: 3
  # Nothing more than five levels above the character: about where a fresh character's hits start to miss and a fight takes more than one heal.
  max_levels_above: 5
  # It picks up its own kills' drops in the area (what the loot priority gives it first); a drop that does not fit ends the run, as the quest autopilot does with a full bag.
  loot: true
  # Below a fifth of its HP, with no heal on the skill bar left to cast, it stops and hands the fight back: one more hard hit could kill it.
  stop_below_hp_percent: 20
  # Five minutes without a kill: far longer than any respawn (20 s), so an empty area does not use up the day.
  idle_stop_ms: 300000
characters:
  # Three characters per account: one per job path to try, and a small list that fits the character-select screen of a phone without scrolling far.
  max_slots: 3
  # Short enough to fit a name plate and the chat, long enough for a first and a last part.
  name_min_length: 3
  name_max_length: 16
  # Latin letters and digits only, so no name can imitate another with look-alike letters of a second script. A fork in another language lists its own
  # letters (from one script). Upper and lower case never make two different names. Digits by the owner's request (2026-11-28, T-814): "Sam01".
  name_letters: [a-z, A-Z, 0-9]
  # Allowed between two letters or digits only (never first, last or doubled): "Anna-Lee", "O'Dell", "Sam_01". The underscore by the owner's request (T-814).
  name_separators: ["-", "'", "_"]
party:
  # Five to a party: four others fit the party panel of the smallest phone, and a full party (140% EXP, formulas.yaml party_exp) is still a small group on the sample maps.
  max_members: 5
  # Thirty seconds to answer an invite: long enough to finish a fight, short enough that an unanswered one does not hang about.
  invite_timeout_ms: 30000
  # Members alive, on the map instance and within 12 cells of the death cell share the EXP: what every player is sure to see (aoi.view_radius x aoi.bucket_size),
  # so who shares is who could see the fight.
  exp_range: 12
  # The same reach for a party member's kill counting toward one's kill objectives.
  kill_credit_range: 12
  # Members more than 15 base levels apart do not share: a high-level friend cannot carry a new character up by standing near it. Their damage dealers split by damage.
  exp_level_gap: 15
trade:
  # Four cells: close enough that a trade is between two who stand together, far enough that a step aside does not end it.
  range: 4
  # Twenty seconds to answer an ask: a trade is asked for face to face, so an answer comes quickly or not at all.
  ask_timeout_ms: 20000
  # Ten entries a side: fits one column of the trade window on the smallest phone; a bigger hand-over is two trades.
  max_entries: 10
guild:
  # Guild names use the letters of character names (characters.name_letters) and their separators, plus a space: "Iron Oaks". Up to 20 fits the guild panel's title on the smallest phone.
  name_min_length: 3
  name_max_length: 20
  name_separators: [" "]
  # No founding cost on the sample maps: their new characters carry hardly any crowns. A fork sets one (currency, an item and its quantity, or both): it is taken in the same
  # transaction that makes the guild.
  # found_cost: { currency: 5000 }
  # Thirty members: a guild panel of two screens on a phone, and a guild channel that stays readable.
  max_members: 30
  # The leader and up to five ranks below it; a rank name fits one line of the members list.
  max_ranks: 6
  rank_name_max_length: 16
  # Thirty seconds to answer an invite, as for a party.
  invite_timeout_ms: 30000
  # A new guild's ranks, the leader's first; new members join at the last. Permissions are the "Guild permissions" terms (VOCABULARY.md).
  default_ranks:
    - name: Leader
      permissions: [invite, kick, edit_notice, set_rank, storage_deposit, storage_items, storage_currency, storage_log]
    - name: Officer
      permissions: [invite, kick, edit_notice, set_rank, storage_deposit, storage_items, storage_currency, storage_log]
    - name: Member
      permissions: [storage_deposit]
  # The emblems a founder picks from: asset keys of the theme (themes/<theme>/asset-manifest.json), never uploaded.
  emblems: [icon.emblem.oak, icon.emblem.star, icon.emblem.wave, icon.emblem.flame]
  # T-905: the guild's shared storage. Fifty entries fill two screens of the storage window on a phone; a move stays in the log for thirty days and the window shows the newest fifty.
  # No daily withdrawal limit: who may take out is the rank's permission (storage_items, storage_currency), and every move is in the log the leader reads.
  storage:
    max_entries: 50
    max_currency: 1000000000
    log_days: 30
    log_shown: 50
