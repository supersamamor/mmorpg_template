# yaml-language-server: $schema=../../schemas/dialogue.schema.json
id: dialogue.guide_intro
name: Guide introduction
start: greet
nodes:
  greet:
    speaker_npc_id: npc.guide
    text: Welcome to the Lumen Vale, traveller. The meadow is crawling with slimes. Care to help thin them out?
    choices:
      - text: Sure, I'll hunt some slimes.
        next: accepted
        actions:
          - type: start_quest
            quest_id: quest.first_hunt
      - text: I've finished the hunt.
        next: report
      - text: Anything else I can do?
        next: more_work
        actions:
          - type: start_quest
            quest_id: quest.gear_up
      - text: I could use a hand with something else.
        next: services
      - text: Not right now.
        next: null
  accepted:
    text: Bring me five slimes' worth of trouble, and three globs of gel as proof. Then come talk to me again.
    next: null
  report:
    text: Excellent work! Take this as thanks for keeping the meadow safe.
    next: null
  more_work:
    text: Equip a leather cap, drink a healing draught, then walk to the old stone circle in the north of the meadow.
    next: null
  services:
    text: I can mark this meadow as your home, so you wake up here after a fall. And while you are still new to the Vale, I can help you rethink how you built yourself.
    choices:
      - text: Make the meadow my home.
        next: home_set
        actions:
          - type: set_save_point
            x: 12
            y: 12
      # Free below base level 10, like the reset items (balance.yaml progression.reset.free_below_base_level).
      - text: Take back my stat points.
        next: stats_reset
        conditions:
          - type: base_level
            max: 9
        actions:
          - type: run_effects
            effects:
              - type: reset_stats
      - text: Let me forget my skills.
        next: skills_reset
        conditions:
          - type: base_level
            max: 9
        actions:
          - type: run_effects
            effects:
              - type: reset_skills
      - text: Never mind.
        next: null
  home_set:
    text: Done. The meadow is your home now. If you fall, you will wake up beside me.
    next: null
  stats_reset:
    text: Every point you spent is yours to spend again.
    next: null
  skills_reset:
    text: Your skills are forgotten, and every skill point is back in your pocket.
    next: null
