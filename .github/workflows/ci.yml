name: CI

# The checks a human runs before merging (CLAUDE.md "Working style"), run by a machine on every push and pull request.
on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: build, test and validate (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false # no step needs the binary art

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: |
            **/*.csproj
            Directory.Packages.props

      - name: Restore
        run: dotnet restore Game.sln

      # Warnings are errors through Directory.Build.props (TreatWarningsAsErrors); the flag keeps that true even if the props change.
      - name: Build
        run: dotnet build Game.sln --no-restore --configuration Release -warnaserror

      - name: Test
        run: dotnet test Game.sln --no-build --configuration Release

      - name: Validate content
        run: dotnet run --no-build --configuration Release --project src/Game.Tools -- validate

      # The schemas are generated from the C# definitions and committed. A diff means someone changed a definition and forgot to run `schema`.
      - name: Generate schemas
        run: dotnet run --no-build --configuration Release --project src/Game.Tools -- schema

      - name: Schemas are up to date
        run: git diff --exit-code -- schemas/

      # Compares the client bundle the content produces now with the committed reference content/client-content.reference.json.
      # Until that file is committed the step prints the current hash and passes (--allow-missing); once it exists, a difference fails.
      - name: Client bundle matches the reference
        run: dotnet run --no-build --configuration Release --project src/Game.Tools -- export-client --check content/client-content.reference.json --allow-missing

  # The tests that need a real PostgreSQL (T-701). A job of its own because service containers run on Linux runners only, and the job above also runs on Windows, where
  # these tests are skipped with their reason. The throw-away server has no password (trust authentication), so none is written here; a missing database fails the job.
  database-tests:
    name: database tests (PostgreSQL)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: mmo
          POSTGRES_DB: mmo_game
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mmo -d mmo_game"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      GAME_TEST_DB_CONNECTION: Host=127.0.0.1;Port=5432;Database=mmo_game;Username=mmo
      GAME_TEST_DB_REQUIRED: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Build
        run: dotnet build Game.sln --configuration Release -warnaserror

      - name: Database tests
        run: dotnet test Game.sln --no-build --configuration Release --filter Category=Database

  # The client is built and exported on every push (T-216): an Android debug APK, a size and contents check, and the headless scripted runs against a real server.
  # Separate from the job above on purpose: a slow export must not hold up the server checks. It has never run on GitHub (written without access to it).
  client-export:
    name: client export and scripted runs (Android debug APK, headless)
    runs-on: ubuntu-latest
    # Hard stop for the whole job: a little over the sum of the step limits below (235 minutes). Each Godot step's limit is the worst case of its script's own bounds (T-221, docs/MOBILE_BUILD.md §8.5),
    # so a hang is stopped, retried and reported by the script long before GitHub would cancel the step. A clean run takes far less.
    timeout-minutes: 240
    env:
      # The pins of docs/MOBILE_BUILD.md. Change them there and here together.
      GODOT_VERSION: 4.7.2
      GODOT_RELEASE: 4.7.2-stable
      JDK_VERSION: "17"
      ANDROID_PLATFORM: android-35
      ANDROID_BUILD_TOOLS: 35.0.1
      # Fails the job when the debug APK grows past this (bytes). T-216 measured 44.3 MB; the unstripped one was 104.2 MB.
      APK_MAX_BYTES: "60000000"
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - uses: actions/setup-java@v4
        with:
          distribution: microsoft
          java-version: ${{ env.JDK_VERSION }}

      # The runner image has an Android SDK; this installs exactly the pinned packages (idempotent).
      - name: Android SDK packages
        timeout-minutes: 10
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "build-tools;${ANDROID_BUILD_TOOLS}" "platforms;${ANDROID_PLATFORM}"

      # Godot and the export templates (the .NET flavour; the folder name must end in .mono), cached by version. Only the templates this job uses are kept.
      - name: Cache Godot and templates
        id: godot-cache
        uses: actions/cache@v4
        with:
          path: |
            ~/godot
            ~/.local/share/godot/export_templates
          key: godot-${{ env.GODOT_RELEASE }}-mono-linux-templates-v1

      - name: Install Godot and templates
        if: steps.godot-cache.outputs.cache-hit != 'true'
        timeout-minutes: 15
        run: |
          base="https://github.com/godotengine/godot/releases/download/${GODOT_RELEASE}"
          mkdir -p ~/godot ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable.mono /tmp/godot-dl
          cd /tmp/godot-dl
          curl -fsSL --retry 3 -O "$base/SHA512-SUMS.txt"
          for file in "Godot_v${GODOT_RELEASE}_mono_linux_x86_64.zip" "Godot_v${GODOT_RELEASE}_mono_export_templates.tpz"; do
            curl -fsSL --retry 3 -O "$base/$file"
            grep " $file\$" SHA512-SUMS.txt | sha512sum -c -
          done
          unzip -q "Godot_v${GODOT_RELEASE}_mono_linux_x86_64.zip" -d ~/godot
          unzip -q -j -o "Godot_v${GODOT_RELEASE}_mono_export_templates.tpz" \
            templates/version.txt templates/android_debug.apk templates/android_release.apk templates/android_source.zip \
            templates/linux_release.x86_64 templates/linux_debug.x86_64 \
            -d ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable.mono
          rm -rf /tmp/godot-dl

      - name: Godot paths and editor settings
        run: |
          godot="$(find ~/godot -maxdepth 2 -name 'Godot_v*_mono_linux.x86_64' -type f | head -n 1)"
          test -n "$godot"
          chmod +x "$godot"
          echo "GODOT=$godot" >> "$GITHUB_ENV"
          mkdir -p ~/.config/godot ~/.local/share/godot/keystores
          # The well-known Android debug credentials (docs/MOBILE_BUILD.md §2.3), not secrets. Release keystores never go into CI from the repo.
          keytool -genkeypair -keyalg RSA -keysize 2048 -validity 10000 -alias androiddebugkey -keypass android -storepass android \
            -keystore ~/.local/share/godot/keystores/debug.keystore -dname "CN=Android Debug,O=Android,C=US"
          {
            echo '[gd_resource type="EditorSettings" format=3]'
            echo
            echo '[resource]'
            echo "export/android/java_sdk_path = \"${JAVA_HOME}\""
            echo "export/android/android_sdk_path = \"${ANDROID_HOME}\""
            echo "export/android/debug_keystore = \"${HOME}/.local/share/godot/keystores/debug.keystore\""
            echo 'export/android/debug_keystore_user = "androiddebugkey"'
            echo 'export/android/debug_keystore_pass = "android"'
          } > ~/.config/godot/editor_settings-4.7.tres
          "$godot" --version

      # Builds the C# project and packs the display bundle (the PackClientBundle target).
      - name: Build the client
        timeout-minutes: 10
        run: dotnet build client/GameClient.csproj --configuration Debug

      # export-android.ps1 (through Invoke-GodotStep): import 3 x 180 s, export 2 x 600 s, plus the C# build. It waits for the APK and its .idsig, then
      # stops Godot if it has not exited 30 s later (on Windows its console wrapper waits for the adb server; T-221).
      - name: Export the Android debug APK
        timeout-minutes: 35
        shell: pwsh
        run: ./client/export-android.ps1 -Godot $env:GODOT -TimeoutSeconds 600

      - name: Check the APK
        run: |
          apk=client/exports/android/game-client.apk
          size=$(stat -c %s "$apk")
          echo "APK: $size bytes (limit $APK_MAX_BYTES)"
          test "$size" -le "$APK_MAX_BYTES"
          unzip -l "$apk" > /tmp/apk.txt
          # the bundle and the settings are in, the Mono static archives are out, arm64-v8a is the only architecture
          grep -q 'assets/bundle/client-content.json' /tmp/apk.txt
          grep -q 'assets/client_settings.json' /tmp/apk.txt
          grep -q 'lib/arm64-v8a/libgodot_android.so' /tmp/apk.txt
          if grep -E 'lib/[^ ]*\.a$' /tmp/apk.txt; then echo "static archives are back in the APK"; exit 1; fi
          if grep -E 'lib/(armeabi-v7a|x86|x86_64)/' /tmp/apk.txt; then echo "another architecture is in the APK"; exit 1; fi

      - name: Keep the APK
        uses: actions/upload-artifact@v4
        with:
          name: game-client-debug-apk
          path: client/exports/android/game-client.apk
          retention-days: 3

      # Real server processes on loopback, the real Godot socket, headless: every run of `all` but account, saving and appearance, which need PostgreSQL and are skipped (and said so), and a
      # Linux release export that must refuse ws://. Worst case of run-e2e.ps1's bounds (T-710): import 3 x 180 s, the runs' own limits (5118 s in all), 16 server starts x 60 s, the release
      # export 2 x 600 s.
      - name: Scripted runs
        timeout-minutes: 135
        shell: pwsh
        run: ./client/run-e2e.ps1 -Run all -Godot $env:GODOT -ExportTimeoutSeconds 600 -ExportAttempts 2

      # The committed grids must equal a fresh headless export of their scenes (T-208, ARCHITECTURE §5.3). `validate` only compares hashes; this compares every byte.
      # Like the rest of this job, it has never run on GitHub (T-219 added it without access to it).
      # Worst case: import 3 x 180 s, map export 3 x 300 s, plus the C# build.
      - name: Check the exported map grids
        timeout-minutes: 30
        shell: pwsh
        run: ./client/export-maps.ps1 -Check -Godot $env:GODOT
